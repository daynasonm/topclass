<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>입시플래너</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f8f7f4;
      }

      .startup {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #4b5563;
        padding: 24px;
        text-align: center;
      }

      .startup-card {
        max-width: 520px;
      }

      .startup-title {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
      }

      .startup-detail {
        font-size: 14px;
        line-height: 1.7;
      }

      .startup-code {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid #e5e7eb;
        color: #1d4ed8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup">
        <div class="startup-card">
          <div class="startup-title">입시플래너를 불러오는 중...</div>
          <div class="startup-detail">잠시만 기다려주세요.</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var isGitHubPages = window.location.hostname.endsWith("github.io");
        var isBuiltDocsPath = window.location.pathname.indexOf("/topclass/docs/") === 0;

        window.__UC_APP_MOUNTED__ = false;

        if (isGitHubPages && !isBuiltDocsPath) {
          fetch("./docs/index.html?asset=" + Date.now(), { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) throw new Error("docs build not found");
              return response.text();
            })
            .then(function (html) {
              var match = html.match(/src="(\.\/assets\/[^"]+\.js)"/);
              if (!match) throw new Error("built asset not found");
              var script = document.createElement("script");
              script.type = "module";
              script.crossOrigin = "anonymous";
              script.src = "./docs/" + match[1].replace("./", "");
              document.head.appendChild(script);
            })
            .catch(function () {
              window.location.replace("/topclass/docs/" + window.location.search + window.location.hash);
            });
        }

        window.setTimeout(function () {
          if (window.__UC_APP_MOUNTED__) return;

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML =
            '<div class="startup"><div class="startup-card">' +
            '<div class="startup-title">앱을 불러오지 못했습니다</div>' +
            '<div class="startup-detail">배포 파일을 아직 불러오지 못했습니다. 잠시 후 새로고침하거나 최신 배포가 완료됐는지 확인해주세요.</div>' +
            '</div></div>';
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
